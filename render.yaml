services:
  - type: worker
    name: sajid-hosting-bot
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: RENDER_DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: sajid-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
